version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: egranja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egranja
      POSTGRES_USER: egranja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-egranja_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egranja -d egranja"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - egranja-net

  minio:
    image: minio/minio:latest
    container_name: egranja-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - egranja-net

  minio-setup:
    image: minio/mc:latest
    container_name: egranja-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set egranja http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing egranja/egranja-media;
      exit 0;
      "
    networks:
      - egranja-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: egranja-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9883:9883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - egranja-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: egranja-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgres://egranja:${POSTGRES_PASSWORD:-egranja_dev}@postgres:5432/egranja?sslmode=disable
      STORAGE_ENDPOINT: minio:9000
      MQTT_BROKER_URL: tcp://mosquitto:1883
    networks:
      - egranja-net

volumes:
  postgres_data:
    name: egranja-postgres-data
  minio_data:
    name: egranja-minio-data
  mosquitto_data:
    name: egranja-mosquitto-data
  mosquitto_log:
    name: egranja-mosquitto-log

networks:
  egranja-net:
    name: egranja-network
    driver: bridge
