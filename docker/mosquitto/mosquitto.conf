# =============================================================
# eGranja - Eclipse Mosquitto Configuration
# =============================================================

# ---- Listeners ----
listener 1883
protocol mqtt

# WebSocket listener (para debug/dashboard web)
listener 9883
protocol websockets

# ---- Autenticacao (dev: anonymous; prod: usar password_file) ----
allow_anonymous true
# password_file /mosquitto/config/passwd

# ---- Persistencia ----
persistence true
persistence_location /mosquitto/data/

# ---- Logging ----
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---- Limites ----
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 0
