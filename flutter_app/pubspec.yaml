name: egranja_flutter
description: "eGranja - Gestao completa de aviarios de corte"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Auth / Storage
  flutter_secure_storage: ^9.2.4

  # Connectivity
  connectivity_plus: ^6.1.4

  # Navigation
  go_router: ^14.8.1

  # Database (Offline-first)
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28

  # Charts
  fl_chart: ^0.70.2

  # SVG
  flutter_svg: ^2.0.17

  # Maps
  google_maps_flutter: ^2.12.1

  # Media
  image_picker: ^1.1.2

  # WebSocket
  web_socket_channel: ^3.0.2

  # Chat UI
  dash_chat_2: ^0.0.21

  # Code Generation (annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # URL Launcher
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  logger: ^2.5.0
  path: ^1.9.1
  drift_flutter: ^0.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  drift_dev: ^2.23.1

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
